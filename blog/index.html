<!DOCTYPE html>

<head>

  .brand{ font-family:'IBM Plex Mono', monospace; font-size:14px; font-weight:500; margin-bottom:32px; }
  h1{ font-family:'Source Serif 4', serif; font-weight:600; font-size:30px; margin:0 0 16px; }
  p{ color:var(--ink-soft); font-size:15px; line-height:1.6; margin:0 0 28px; }
  a.home{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink); text-decoration:none; border-bottom:1px solid var(--ink); padding-bottom:1px; }
  a.home:hover{ opacity:0.7; }
</style>
</head>
<body>
  <div class="wrap">
